[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep repo tooling files from being served publicly

[[redirects]]
  from = "/Dockerfile"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.dockerignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/compose.yaml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/compose.debug.yaml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
